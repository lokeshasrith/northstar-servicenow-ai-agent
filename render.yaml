services:
  - type: web
    name: northstar-incident-agent
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: northstar-db
          property: connectionString
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: SERVICENOW_MODE
        value: mock

databases:
  - name: northstar-db
    databaseName: northstar
    user: northstar
    plan: free
    region: singapore
    postgresMajorVersion: "16"
