name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  container:
    name: Full-stack container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build full-stack image
        run: docker build -f backend/Dockerfile -t northstar-ci .
      - name: Start and check the app
        run: |
          docker run -d --name northstar-ci -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/northstar-ci.db \
            -e PUBLIC_DEMO_MODE=true northstar-ci
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:8000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/ | grep -q 'id="root"'
      - name: Show container logs on failure
        if: failure()
        run: docker logs northstar-ci
      - name: Stop container
        if: always()
        run: docker rm -f northstar-ci || true
